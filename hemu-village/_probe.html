<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe</title>

</head><body style="margin:0"><canvas id="c" style="width:100vw;height:100vh;display:block"></canvas>
<script type="module">
import * as THREE from 'three';
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x223344);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);

window.__probe = { ok: true, calls: renderer.info.render.calls };
document.title = 'probe-ok';
