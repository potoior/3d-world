<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const step = (s) => { document.title = s; window.__step = s; };
step('start');
try {
  const { buildMeiliScene } = await import('./src/meili.js');
  const world = buildMeiliScene();
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
  renderer.setPixelRatio(1); renderer.setSize(480, 300);

  } else if (only != null) {
